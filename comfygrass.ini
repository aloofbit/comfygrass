; comfygrass: moving grass for the 1.12 client.
;
; Lives in the client root next to d3d9.dll. F9 captures one frame of draw calls to comfygrass.log;
; F10 reloads this file AND toggles the effect, so tuning needs no restart (press it twice to reload
; and leave the effect on).

[general]
effect         = 1
log            = 1
hook           = 1     ; 0 = pure pass-through proxy, for bisecting problems
probeKey       = 120   ; VK_F9
toggleKey      = 121   ; VK_F10
probeVertices  = 12
scale          = 2.0   ; wind strength multiplier; parting is deliberately not affected by this

worldPhase     = 0     ; 0 = phase from chunk-local coords (stable); 1 = adds the camera-relative world offset
reportEvery    = 20    ; log cost every N frames, 0 = off

; Which draw calls are grass, from the frilldensity 1 vs 256 captures: stride 36
; (POSITION f3 @0, NORMAL f3 @12, COLOR @24, TEXCOORD0 f2 @28), fixed function, triangle lists.
; minVerts 64 excludes the ~65 small stride-36 draws that are ordinary doodads sharing the format.
; This client binds vertex declarations, not FVF, so every draw reports fvf=0. Match on stride.
[match]
fvf      = 0xFFFFFFFF
stride   = 36
minVerts = 64
maxVerts = 0
primType = 4          ; D3DPT_TRIANGLELIST
identityRotation = 1   ; grass is chunk-batched; doodads carry a rotation

[wind]
enabled         = 1
directionDeg    = 45.0
speed           = 3.0
amplitude       = 0.060
wavelength      = 18.0
crossAmplitude  = 0.020
crossWavelength = 6.5
crossAngleDeg   = 35.0
lean            = 0.35
variance        = 0.6
anchor          = 0.70    ; fraction of the blade held still, from the quad base

; Parting: blades lean away from the player.
;
; The anchor is the player's position, read from the object manager in the running client.
; camAddr/anchorAddr are the camera position and its look-at target inside WoW.exe, found by
; disassembly (see README). Set either to 0 to switch parting off.
[physics]
enabled      = 1
radius       = 2.0     ; influence radius around the player, yards
forceCenter  = 0.5     ; lean strength at the player
forceEdge    = 0.0     ; lean strength out at the radius
centerZ      = 0.0     ; shift the anchor along Z from the player's feet, yards
zRange       = 4.0     ; ignore grass more than this far above/below the anchor, yards
zFade        = 2.0     ; fade band at that limit, yards
camAddr      = 0x00C7CF20   ; camera world position in WoW.exe
anchorAddr   = 0x00C7D118   ; camera aim point, one yard out: minus camAddr it is the view direction
objMgrAddr   = 0x00B41414   ; object manager, walked to find the local player
playerPosOff = 0x9B8        ; position inside the player object; 0 re-runs the geometric search
posScanMax   = 0x1400       ; how far into the object that search looks, bytes
posScanFrames = 90          ; frames a candidate must survive before it is believed
reportAnchor = 1            ; log the anchor and the chunk-grid check alongside the cost report
